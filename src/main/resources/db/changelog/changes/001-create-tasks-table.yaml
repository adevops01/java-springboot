databaseChangeLog:
  - changeSet:
      id: 001-create-tasks-table
      author: adevops01
      changes:
        - createTable:
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: done
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false